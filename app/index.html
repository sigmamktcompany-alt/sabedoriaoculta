<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CÚPULA 33 | Plataforma de Membros & Acervo Hermético</title>
  <meta name="description" content="Acesso exclusivo ao maior acervo digital de manuscritos históricos, hermetismo, cabala, grimórios e frequências de Solfeggio.">
  <meta name="theme-color" content="#070709">
  
  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cúpula 33">
  
  <!-- Fonts: Cinzel + Inter + Playfair -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800;900&family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gold: {
              300: '#f3e5ab',
              400: '#e6ca65',
              500: '#d4af37',
              600: '#aa8c2c',
              700: '#806921',
            },
            dark: {
              950: '#040405',
              900: '#070709',
              850: '#0a0a0d',
              800: '#0d0e12',
              700: '#14161d',
              600: '#1e212b',
              500: '#2a2e3d'
            }
          },
          fontFamily: {
            cinzel: ['Cinzel', 'serif'],
            serif: ['Playfair Display', 'serif'],
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="app.css?v=1795415601">
</head>
<body class="bg-dark-950 text-gray-200 font-sans antialiased min-h-screen flex flex-col pb-24 sm:pb-12 selection:bg-gold-500/20 selection:text-gold-400">

  <!-- ==================== TELA INICIAL DE LOGIN VIP (GATEWAY OBRIGATÓRIO) ==================== -->
  <div id="vipLoginGate" style="opacity: 1 !important; display: flex !important;" class="fixed inset-0 z-[10000] bg-dark-950/98 backdrop-blur-2xl flex items-center justify-center p-4 transition-opacity duration-300">
    <!-- Efeito de fundo místico -->
    <div class="absolute inset-0 pointer-events-none bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-gold-500/15 via-dark-950/80 to-dark-950"></div>
    <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#d4af37_1px,transparent_1px)] [background-size:24px_24px]"></div>

    <div class="relative w-full max-w-md rounded-3xl p-7 sm:p-9 border border-gold-500/40 bg-[#0b0c10]/95 shadow-[0_0_50px_rgba(212,175,55,0.15)] text-center">
      
      <!-- Brasão Oficial Cúpula 33 -->
      <div class="relative w-20 h-20 mx-auto mb-5">
        <div class="absolute inset-0 rounded-2xl bg-gold-500/20 blur-xl animate-pulse"></div>
        <img src="assets/logo.jpg" alt="Cúpula 33" class="relative w-20 h-20 rounded-2xl object-cover border-2 border-gold-500/60 shadow-2xl mx-auto">
      </div>

      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-gold-500/15 border border-gold-500/40 text-gold-400 text-[10px] font-black uppercase tracking-widest mb-3">
        <i data-lucide="shield-check" class="w-3.5 h-3.5"></i> Portal Exclusivo de Membros
      </div>

      <h1 class="font-cinzel font-black text-2xl sm:text-3xl tracking-wider text-white mb-2">
        CÚPULA <span class="text-gold-400">33</span>
      </h1>
      <p class="text-xs text-gray-300 mb-6 leading-relaxed">
        Digite o <strong>e-mail utilizado na compra</strong> na PerfectPay para autenticar e liberar seu acesso ao acervo sagrado.
      </p>

      <!-- Formulário de Login -->
      <div class="space-y-3.5 text-left mb-6">
        <div>
          <label class="block text-[11px] font-bold text-gold-400/90 uppercase tracking-wider mb-1.5 ml-1">E-mail Cadastrado</label>
          <div class="relative">
            <i data-lucide="mail" class="w-4 h-4 text-gray-500 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input
              type="email"
              id="gateEmailInput"
              placeholder="seu.email@exemplo.com"
              autocomplete="email"
              onkeydown="if(event.key === 'Enter') authenticateGateLogin()"
              class="w-full pl-10 pr-4 py-3 rounded-xl bg-dark-900 border border-gold-500/30 text-xs sm:text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-gold-400 focus:ring-1 focus:ring-gold-400/50 transition shadow-inner"
            >
          </div>
        </div>

        <button
          id="gateSubmitBtn"
          onclick="authenticateGateLogin()"
          class="w-full py-3.5 rounded-xl bg-gradient-to-r from-gold-500 via-amber-400 to-gold-500 text-black font-black text-xs sm:text-sm uppercase tracking-wider flex items-center justify-center gap-2 shadow-xl hover:scale-[1.02] active:scale-[0.98] transition-all cursor-pointer"
        >
          <i data-lucide="lock-open" class="w-4 h-4"></i>
          <span>Entrar no Acervo Sagrado</span>
        </button>

        <!-- Mensagens de status/erro -->
        <div id="gateStatusMsg" class="text-xs text-center min-h-[20px] transition-all font-medium pt-1"></div>
      </div>

      <!-- Links de Suporte e Checkout -->
      <div class="pt-5 border-t border-dark-700/80 flex flex-col gap-2.5 text-xs">
        
        <button onclick="closeModal('profileModal')" class="w-full py-2.5 rounded-xl bg-dark-800 text-gray-400 text-xs font-semibold hover:text-white transition">
          Fechar
        </button>
      </div>

    </div>
  </div>

  <!-- Lucide Icon Renderer & App Script -->
  <script src="app.js?v=1795415601"></script>
  <script>
    // Forçar limpeza de caches locais em celulares iOS / Safari / Chrome Mobile
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let r of registrations) { r.unregister(); }
      });
    }
    if ('caches' in window) {
      caches.keys().then(names => {
        for (let name of names) { caches.delete(name); }
      });
    }
  </script>
</body>
</html>
